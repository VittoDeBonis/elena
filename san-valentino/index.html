<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💝 San Valentino</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="heart-background">
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
        </div>
        
        <div class="content" id="questionContent">
            <h1 class="title">💕</h1>
            <h2 class="question">Vuoi essere il mio San Valentino?</h2>
            
            <div class="buttons">
                <button class="btn btn-yes" id="btnYes">Sì! 💝</button>
                <button class="btn btn-no" id="btnNo">No</button>
            </div>
        </div>

        <div class="content hidden" id="successContent">
            <h1 class="celebration">🎉 💝 🎉</h1>
            <h2 class="success-message">Sapevo che avresti detto di sì!</h2>
            <p class="love-message">Ti amo tanto! ❤️</p>
            <div class="confetti"></div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
